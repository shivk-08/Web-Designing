<!DOCTYPE html>
<html>
<head>
<title>Navigation Menu</title>
<style>
ul{
    list-style:none;
    background:black;
    overflow:hidden;
}
li{
    float:left;
}
li a{
    display:block;
    color:white;
    padding:14px 20px;
    text-decoration:none;
}
li a:hover{
    background:gray;
}
</style>
</head>
<body>

<ul>
<li><a href="#">Home</a></li>
<li><a href="#">About</a></li>
<li><a href="#">Services</a></li>
<li><a href="#">Contact</a></li>
</ul>

</body>
</html>
